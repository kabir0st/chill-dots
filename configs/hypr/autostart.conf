# Start awww daemon for smooth wallpaper transitions
exec-once = awww-daemon

# Export session env for systemd user services (wallpaper timer, etc.)
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_RUNTIME_DIR DISPLAY

# Apply wallust theme on startup
exec-once = sleep 1 && ~/.config/hypr/scripts/wallpaper.sh "$(readlink -f ~/.config/omarchy/current/background)"

# CopyQ clipboard manager
exec-once = copyq --start-server
