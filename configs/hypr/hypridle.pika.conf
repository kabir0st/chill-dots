# hypridle for PikaOS + niri — locks via pikabar-lock, DPMS via niri msg.
# Deployed as ~/.config/hypr/hypridle.conf by the lock-idle module (pika).
general {
    lock_cmd = pikabar-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors
    inhibit_sleep = 3
}

listener {
    timeout = 300                      # 5min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360                                       # 6min
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}
