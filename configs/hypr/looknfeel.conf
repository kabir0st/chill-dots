# Riced look'n'feel with wallust auto-theming

# Source wallust-generated colors
source = ~/.config/hypr/wallust/colors-hyprland.conf

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2

    # Wallust-driven border colors
    col.active_border = $wallust_color4 $wallust_color12 45deg
    col.inactive_border = $wallust_color0

    resize_on_border = true
    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 12

    dim_inactive = true
    dim_strength = 0.1

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000055)
        offset = 0, 4
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.5
        new_optimizations = true
        xray = false
        special = true
        popups = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#group
group {
    col.border_active = $wallust_color4 $wallust_color12 45deg
    col.border_inactive = $wallust_color0

    groupbar {
        font_size = 11
        font_family = JetBrainsMono Nerd Font
        font_weight_active = bold
        font_weight_inactive = normal
        indicator_height = 3
        indicator_gap = 4
        height = 24
        gaps_in = 4
        gaps_out = 0
        text_color = $wallust_foreground
        col.active = $wallust_color4
        col.inactive = $wallust_color0
        gradients = true
        gradient_rounding = 8
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Smooth bezier curves inspired by Hyprlust
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.0
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = fluent, 0.05, 0.8, 0.1, 1

    animation = windows, 1, 5, wind, slide
    animation = windowsIn, 1, 5, winIn, slide
    animation = windowsOut, 1, 5, smoothOut, slide
    animation = windowsMove, 1, 4, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 0, 30, liner, loop
    animation = fade, 1, 5, smoothIn
    animation = fadeDim, 1, 5, smoothIn
    animation = workspaces, 1, 5, wind
    animation = specialWorkspace, 1, 5, overshot, slidevert
    animation = layers, 1, 4, fluent, slide
    animation = layersIn, 1, 4, fluent, slide
    animation = layersOut, 1, 3, smoothOut, slide
}

# Window opacity rules for glass effect
windowrule = opacity 0.92 0.88, match:tag terminal
windowrule = opacity 0.95 0.90, match:class (nautilus|thunar)
windowrule = opacity 0.95 0.90, match:class (Code|code)

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

cursor {
    hide_on_key_press = true
}

binds {
    hide_special_on_workspace_change = true
}
