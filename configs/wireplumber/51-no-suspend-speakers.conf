monitor.alsa.rules = [
  {
    matches = [
      {
        # Any onboard (PCI) analog output — the exact node name changes with
        # the PCI slot from machine to machine. SPA-JSON rejects \-escapes,
        # so the dots stay unescaped (harmless: regex . matches them anyway).
        node.name = "~alsa_output.pci-.*analog-stereo"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
