# Base theme (per-OS: Omarchy theme on Arch, empty placeholder on PikaOS)
include theme.conf
# Wallust auto-generated colors (override theme)
include ~/.config/kitty/wallust-colors.conf

# Font — Nerd Font + emoji fallback
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0

# Emoji fallback
symbol_map U+1F600-U+1F64F Noto Color Emoji
symbol_map U+1F300-U+1F5FF Noto Color Emoji
symbol_map U+1F680-U+1F6FF Noto Color Emoji
symbol_map U+1F1E0-U+1F1FF Noto Color Emoji
symbol_map U+2600-U+26FF   Noto Color Emoji
symbol_map U+2700-U+27BF   Noto Color Emoji
symbol_map U+FE00-U+FE0F   Noto Color Emoji
symbol_map U+1F900-U+1F9FF Noto Color Emoji
symbol_map U+1FA00-U+1FA6F Noto Color Emoji
symbol_map U+1FA70-U+1FAFF Noto Color Emoji
symbol_map U+200D          Noto Color Emoji
symbol_map U+23CF-U+23F3   Noto Color Emoji
symbol_map U+231A-U+231B   Noto Color Emoji

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.85

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

# Allow remote access
allow_remote_control yes

# Aesthetics
cursor_shape underline
cursor_underline_thickness 2.0
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
shell_integration no-cursor
enable_audio_bell no
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
